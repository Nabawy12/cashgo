name: cashgo
description: A starter POS desktop app (admin + cashier) built with Flutter.
publish_to: "none"
version: 1.0.2+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.2.8
  path: ^1.8.3
  printing: ^5.14.2
  pdf: ^3.11.3
  sqflite_common_ffi: ^2.4.2
  intl: ^0.20.2
  esc_pos_utils_plus: ^2.0.4
  flutter_svg: ^2.0.13
  fl_chart: ^1.0.0
  accordion_widget: ^1.0.0
  wakelock_plus: ^1.3.2
  shimmer: ^3.0.0
  html: ^0.15.6
  skeletonizer: ^2.1.0+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  connectivity_plus: ^7.0.0
  crypto: ^3.0.6
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.17.0
  flutter_launcher_icons: ^0.14.3

msix_config:
  display_name: CashGO_VAPE
  publisher_display_name: ZeyadNabawy
  identity_name: Cashgosystem.CashGOVAPE
  publisher: CN=65B4ED42-702C-4FB6-9A7D-4DDD713C0CA5
  msix_version: 1.0.2.0
  store: true
  install_certificate: false
  vc_redist: true
  logo_path: assets/icons/icon.png
  tile_icon_path: assets/icons/icon.png
  vs_generated_images_folder_path: assets/icons

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/icons/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Cairo-Regular.ttf
    - assets/icons/
    - assets/images/