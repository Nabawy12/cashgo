name: cashgo
description: A starter POS desktop app (admin + cashier) built with Flutter.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.2.8
  path: ^1.8.3
  provider: ^6.0.5
  printing: ^5.14.2
  pdf: ^3.11.3
  http: ^1.5.0
  quick_usb: any
  sqflite_common_ffi: ^2.3.6
  path_provider: ^2.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Uncomment the assets lines below after adding actual files in these folders
  # assets:
  #   - assets/images/
  #   - assets/icons/
