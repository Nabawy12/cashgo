name: cashgo
description: A starter POS desktop app (admin + cashier) built with Flutter.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.2.8
  path: ^1.8.3
  printing: ^5.14.2
  pdf: ^3.11.3
  sqflite_common_ffi: ^2.3.6
  intl: ^0.20.2
  esc_pos_utils_plus: ^2.0.4
  flutter_svg: ^2.0.13
  fl_chart: ^1.0.0
  accordion_widget: ^1.0.0
  wakelock_plus: ^1.3.2
  shimmer: ^3.0.0
  html: ^0.15.6
  skeletonizer: ^2.1.0+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  connectivity_plus: ^7.0.0
  crypto: ^3.0.6
  sqlite3_flutter_libs: ^0.6.0+eol
  url_launcher: ^6.3.2

dependency_overrides:
  sqlite3: ^2.9.0
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Cairo-Regular.ttf
    - assets/icons/
    - assets/images/
