name: Build Flutter Windows App

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter (pin specific stable version)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'

      - name: Show Flutter / Dart version (after install)
        run: |
          flutter --version
          dart --version

      - name: Flutter doctor (diagnostic)
        run: flutter doctor -v

      - name: Ensure Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Clean and fetch dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Show resolved package versions (ffi/sqlite3)
        run: flutter pub deps --style=compact | Select-String -Pattern "ffi|sqlite3|sqflite_common_ffi"

      - name: Build Windows release
        run: flutter build windows --release

      - name: Copy sqlite3 DLLs to release folder if present
        if: success()
        shell: powershell
        run: |
          $pubCache = "$env:USERPROFILE\\AppData\\Local\\Pub\\Cache"
          $dest = "build\\windows\\x64\\runner\\Release"
          Get-ChildItem -Path $pubCache -Recurse -Filter "sqlite3*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object {
              if (!(Test-Path $dest)) { New-Item -ItemType Directory -Path $dest -Force | Out-Null }
              Copy-Item -Path $_.FullName -Destination $dest -Force
            }

      - name: Create zip file
        run: |
          if (Test-Path build\\windows\\x64\\runner\\Release) {
            Compress-Archive -Path build\\windows\\x64\\runner\\Release\\* -DestinationPath CashGo-windows.zip -Force
          } else {
            Write-Error "Release folder not found: build\\windows\\x64\\runner\\Release"
            exit 1
          }

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Upload Windows build
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: CashGo-windows.zip
          asset_name: CashGo-windows.zip
          asset_content_type: application/zip
