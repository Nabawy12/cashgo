name: Build Flutter Windows App and Publish Release

on:
  push:
    branches: [ master, ci-windows-build ]
  workflow_dispatch:

permissions:
  contents: write   # يلزم لإنشاء release ورفع assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create zip file
        run: |
          if (Test-Path -Path build/windows/x64/runner/Release) {
            Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath CashGo-windows.zip -Force
          } else {
            Write-Error "Release folder not found!"
          }

      - name: Create GitHub Release and upload ZIP
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: CashGo-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
